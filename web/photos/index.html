<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harvey field photos · Houston</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #111827; color: #f3f4f6; font: 1rem/1.5 system-ui, sans-serif; }
    main { max-width: 58rem; margin: auto; padding: 1.5rem clamp(1rem, 5vw, 3rem) 3rem; }
    a { color: #93c5fd; }
    a:focus-visible { outline: 2px solid #fde68a; outline-offset: 3px; }
    h1 { margin: 1rem 0 .25rem; line-height: 1.15; }
    h2 { font-size: 1.25rem; margin: 1.75rem 0 .5rem; }
    p { margin: .5rem 0; }
    figure { margin: 0; }
    figcaption { margin-top: .35rem; }
    img { display: block; width: 100%; height: auto; border-radius: .4rem; }
    .road { width: min(100%, 24rem); }
    .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
    .source { font-size: .875rem; }
    @media (max-width: 36rem) { .pair { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <a href="../index.html">← Meyerland replay</a>
    <h1>Harvey field photos</h1>
    <p>USGS photographed these two Houston sites outside the Meyerland replay area.</p>

    <h2>Buffalo Bayou at Piney Point</h2>
    <figure>
      <img class="road" src="piney-point-2017-08-27.jpg" width="750" height="1000"
           alt="Floodwater covers a tree-lined road. A police vehicle is visible in the distance.">
      <figcaption>August 27, 2017 · 10:45 a.m. CDT. Street depth is unknown.</figcaption>
    </figure>
    <p class="source"><a href="https://www.usgs.gov/media/images/hurricane-harvey-flooding-buffalo-bayou-piney-point">USGS field photograph · public domain</a></p>

    <h2>Addicks Reservoir</h2>
    <div class="pair">
      <figure>
        <img src="addicks-2017-08-29.jpg" width="1000" height="755"
             alt="Floodwater reaches the walkway at the reservoir structure.">
        <figcaption>August 29, 2017 · During Harvey</figcaption>
      </figure>
      <figure>
        <img src="addicks-2018-04-06.jpg" width="1000" height="755"
             alt="The exposed walkway supports and channel bed are visible at lower water.">
        <figcaption>April 6, 2018 · Eight months later</figcaption>
      </figure>
    </div>
    <p class="source"><a href="https://www.usgs.gov/media/before-after/hurricane-harvey-flooding-addicks-reservoir-houston-tx">USGS reservoir comparison · public domain</a></p>
  </main>
</body>
</html>
